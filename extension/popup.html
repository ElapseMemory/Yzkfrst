<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Safe Page Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Safe Page Translator</h1>
      <p>输入文本并选择目标语言，使用你配置的翻译服务。</p>
      <label class="field">
        <span>使用模板</span>
        <select id="profile-select"></select>
      </label>
      <label class="field">
        <span>原文</span>
        <textarea id="source-text" rows="4" placeholder="在此粘贴或输入文本"></textarea>
      </label>
      <label class="field">
        <span>目标语言</span>
        <input id="target-language" type="text" value="zh-CN" />
      </label>
      <button id="translate-button">翻译</button>
      <button id="translate-page" class="secondary">翻译当前页面</button>
      <section id="result" hidden>
        <h2>翻译结果</h2>
        <pre id="translation-output"></pre>
      </section>
      <p class="hint">
        翻译服务的接口地址、API Key 等信息可在扩展设置页中配置。
      </p>
      <footer>
        <button id="open-options">打开设置</button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
